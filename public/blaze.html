<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blaze Engine — Accounts Queue</title>
<style>
body{font-family:Inter,Arial,sans-serif;background:#f5f7f9;color:#17202a;margin:0}.wrap{max-width:1200px;margin:32px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.title{font-size:25px;font-weight:800}.muted{color:#667085}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:18px;box-shadow:0 2px 8px #0000000a;margin-bottom:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:#111;color:#fff}.green{background:#087f5b;color:#fff}.blue{background:#175cd3;color:#fff}.red{background:#b42318;color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:12px 10px;border-bottom:1px solid #eaecf0;text-align:left;vertical-align:top}th{font-size:12px;text-transform:uppercase;color:#667085}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2ff;font-size:11px;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap}.msg{margin:10px 0;padding:10px 12px;border-radius:8px;background:#f2f4f7}.ok{background:#ecfdf3;color:#027a48}.err{background:#fef3f2;color:#b42318}.small{font-size:12px}.number{font-weight:800}.empty{text-align:center;padding:35px;color:#667085}
</style></head>
<body><div class="wrap">
<div class="top"><div><div class="title">Blaze Engine · Accounts Queue</div><div class="muted">LBL Portal → Blaze Engine sales-document workflow</div></div><div class="toolbar"><button class="btn primary" onclick="load()">Refresh</button><a class="btn" href="/">Back to Portal</a></div></div>
<div id="who" class="card muted">Checking your LBL Portal session…</div>
<div id="message"></div>
<div class="card"><div class="table-wrap"><table><thead><tr><th>Sale</th><th>Client</th><th>Property</th><th>Payment</th><th>Status</th><th>Documents</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody></table></div></div>
</div>
<script>
let me=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let b=null;try{b=await r.json()}catch{}if(!r.ok)throw Error(b?.error||`Request failed (${r.status})`);return b}
function money(v){return '₦'+Number(v||0).toLocaleString('en-NG')}
function show(text,ok=false){$('message').innerHTML=`<div class="msg ${ok?'ok':'err'}">${esc(text)}</div>`;setTimeout(()=>{$('message').innerHTML=''},5000)}
function canGenerate(){return ['accountant','finance_operations','admin'].includes(String(me?.role||'').toLowerCase())}
function canVerify(){return ['sales_manager','manager','admin'].includes(String(me?.role||'').toLowerCase())}
async function session(){const r=await api('/api/auth/me');me=r;$('who').innerHTML=`<b>${esc(r.displayName)}</b> · ${esc(r.role)} · ${esc(r.email||'')}`}
async function action(action,saleId,button){button.disabled=true;const old=button.textContent;button.textContent='Working…';try{const r=await api('/api/blaze',{method:'POST',body:JSON.stringify({action,saleId})});show(r.result?.result||r.result?.documentNumber||'Completed',true);await load()}catch(e){show(e.message)}finally{button.disabled=false;button.textContent=old}}
function actionButtons(s){const out=[];if(s.status==='PAYMENT_PROOF_SUBMITTED'&&canGenerate())out.push(`<button class="btn blue" onclick="action('generate','${esc(s.id)}',this)">Generate Doc</button>`);if(s.status==='INVOICE_ENTERED'&&canVerify())out.push(`<button class="btn green" onclick="action('sales_verify','${esc(s.id)}',this)">2nd Sales Verify</button>`);if(s.status==='SALES_APPROVED'&&canGenerate())out.push(`<button class="btn primary" onclick="action('send_to_client','${esc(s.id)}',this)">Send to Client</button>`);return out.join('')||'<span class="muted small">Waiting for next department</span>'}
function render(sales){if(!sales.length){$('rows').innerHTML='<tr><td colspan="7" class="empty">No sales are waiting in the LBL workflow.</td></tr>';return}$('rows').innerHTML=sales.map(s=>`<tr><td><div class="number">${esc(s.sale_reference||s.id)}</div><div class="muted small">${esc(s.id)}</div></td><td><b>${esc(s.client_name)}</b><div class="muted small">${esc(s.client_email||'')}</div></td><td>${esc(s.property_name||'—')}<div class="muted small">${esc(s.plot_reference||'')}</div></td><td>${money(s.payment_amount)}<div class="muted small">${esc(s.payment_plan||'')} · ${esc(s.payment_reference||'')}</div></td><td><span class="badge">${esc(s.status)}</span><div class="muted small">${esc(s.payment_status||'')}</div></td><td><div class="small">${esc(s.invoice_number||s.sales_order_no||'Not generated')}</div><div class="muted small">Receipt: ${esc(s.sales_receipt_no||'generated with document')}</div></td><td><div class="actions">${actionButtons(s)}</div></td></tr>`).join('')}
async function load(){try{if(!me)await session();const r=await api('/api/blaze');render(r.sales||[])}catch(e){show(e.message);$('rows').innerHTML='<tr><td colspan="7" class="empty">Unable to load the Blaze Engine queue.</td></tr>'}}
session().then(load).catch(e=>show(e.message));
</script></body></html>
